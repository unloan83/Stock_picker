name: Stock Picker tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/website-daily-picks]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/ -q
      - run: python -m compileall -q stock_finder
      - name: Live source/model smoke test (no Telegram, no DB writes)
        run: python scripts/live_sources_smoke.py
        timeout-minutes: 5
