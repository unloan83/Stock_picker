name: Stock Picker tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/website-daily-picks]

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e '.[dev]'
      - run: python -m pytest tests/ -q
      - run: python -m compileall -q stock_finder
      - name: Live source/model smoke test (no Telegram, no DB writes)
        run: python scripts/live_sources_smoke.py
        timeout-minutes: 5

  mock_live_telegram:
    if: github.event_name == 'push' && contains(github.event.head_commit.message, '[oneoff-mock-live]')
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -e .
      - name: Mock live collection, full model, SQLite and real Telegram attempt
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.STOCK_FINDER_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
          ALLOWED_CHAT_IDS: ${{ secrets.STOCK_FINDER_TELEGRAM_CHAT_IDS || secrets.ALLOWED_CHAT_IDS }}
        run: python scripts/mock_live_telegram.py
