[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stock-finder"
version = "0.1.0"
description = "Telegram bot that rates NSE stocks (long term / intraday / not recommended) and options, with the drivers behind each verdict"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "requests>=2.31",
    "yfinance>=0.2.54",
    "python-telegram-bot>=21.0,<23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5"]
# Morning TV shortlist (also needs the system ffmpeg)
tv = ["yt-dlp[default]>=2025.1.15"]  # [default] adds the YouTube JavaScript solver; deno runs it
# Transcribe on this machine instead of Groq (slow on small CPUs; see README)
tv-local = ["faster-whisper>=1.1"]

[tool.setuptools.packages.find]
include = ["stock_finder*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
